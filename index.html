<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薪酬、績效考核與晉升管理辦法｜投影片</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#101418;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#E8EDF2}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px 10px 64px}
  #slide{max-width:100%;max-height:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.55)}
  #bar{position:fixed;left:0;right:0;bottom:0;min-height:56px;background:rgba(16,20,24,.92);border-top:1px solid #2A333D;display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:wrap;justify-content:center}
  #bar button,#bar select{background:#1D2630;color:#E8EDF2;border:1px solid #3A4654;border-radius:8px;padding:9px 13px;font-size:15px;cursor:pointer}
  #bar button:hover{background:#27313D}
  #bar a{background:#24507E;color:#fff;border-radius:8px;padding:9px 13px;font-size:15px;text-decoration:none}
  #info{font-size:14.5px;color:#C7D2DD;min-width:0;text-align:center}
  #info b{color:#fff}
  #grid{position:fixed;inset:0;background:rgba(10,13,16,.97);overflow:auto;display:none;padding:18px;z-index:20}
  #grid.open{display:block}
  #grid h2{font-size:19px;margin:4px 0 14px}
  #grid .close{position:sticky;top:0;float:right}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .cell{cursor:pointer}
  .cell img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:2px solid transparent;background:#fff}
  .cell.cur img{border-color:#4C9AFF}
  .cell span{display:block;font-size:13px;color:#C7D2DD;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:640px){ #info{display:none} #bar{gap:6px} #bar button,#bar select,#bar a{padding:8px 10px;font-size:14px} }
</style>
</head>
<body>
<div id="stage"><img id="slide" alt="投影片"></div>

<div id="grid">
  <button class="close" onclick="toggleGrid(false)" style="background:#1D2630;color:#E8EDF2;border:1px solid #3A4654;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer">✕ 關閉總覽</button>
  <h2>全部投影片（點任一張跳過去）</h2>
  <div class="cells" id="cells"></div>
</div>

<div id="bar">
  <button id="prev">◀ 上一頁</button>
  <button id="next">下一頁 ▶</button>
  <span id="info"></span>
  <select id="jump" aria-label="跳到章節"></select>
  <button id="gridBtn">總覽</button>
  <button id="fsBtn">全螢幕</button>
  <a href="manual.pptx" download>下載 PPTX</a>
</div>

<script>
var TITLES = ["企業人力資源管理制度手冊", "目錄", "目錄（續 1 ）", "目錄（續 2 ）", "01 總則與文件管制", "01 總則與文件管制（續 1 ）", "02 權責分工與核決權限", "02 權責分工與核決權限（續 1 ）", "03 薪酬定義與整體架構", "03 薪酬定義與整體架構（續 1 ）", "04 六大職系及職涯雙軌", "04 六大職系及職涯雙軌（續 1 ）", "05 職等認定與標準敘薪", "05 職等認定與標準敘薪（ G1–G7 ）", "05 職等認定與標準敘薪（ G8–G13 ）", "06 十三職等職位與薪資區間", "06 十三職等職位與薪資區間（續 1 ）", "07 附表一： 104 級標準敘薪表（本薪）", "07 附表一： 104 級標準敘薪表（本薪）（續 1 ）", "07 附表一： 104 級標準敘薪表（本薪）（續 2 ）", "08 附表二： 104 級標準固定月薪", "08 附表二： 104 級標準固定月薪（續 1 ）", "08 附表二： 104 級標準固定月薪（續 2 ）", "09 附表三：職務加給與津貼", "09 附表三：職務加給與津貼（續 1 ）", "09 附表三：職務加給與津貼（續 2 ）", "10 新人核薪與年資認定", "10 新人核薪與年資認定（續 1 ）", "10 新人核薪與年資認定（續 2 ）", "11 試用考核與正式任用", "11 試用考核與正式任用（續 1 ）", "12 績效管理週期及目標設定", "12 績效管理週期及目標設定（續 1 ）", "13 績效評等與校準", "13 績效評等與校準（續 1 ）", "14 績效面談、申訴與改善", "14 績效面談、申訴與改善（續 1 ）", "15 年度調薪政策與薪級矩陣", "15 年度調薪政策與薪級矩陣（續 1 ）", "16 職務調任與代理加給", "17 年終獎金：第 34 條 適用與核定", "17 年終獎金：第 35 條 計算公式", "17 年終獎金：績效係數與年度考績", "17 年終獎金試算（一）：全年在職", "17 年終獎金試算（二）：年度中到職", "17 年終獎金：第 36 條 核發程序", "18 績效獎金：第 37 條 半年度獎金", "18 績效獎金：第 38 條 計算案例", "18 專案績效獎金與分配規則", "19 業績獎金：第 39 條 計算基礎", "19 業績獎金：第 40 條 新客戶開發", "19 新客戶開發獎金：完整試算", "19 新客戶獎金：部分回款與共同開發", "19 業績獎金：第 41 條 年度成長獎金", "19 年度成長獎金：三種情境", "19 業績獎金：審查與異常處理", "20 專業認證獎金：第 42 條", "20 員工酬勞：第 43 條", "21 福利、節金及補助", "21 福利、節金及補助（續 1 ）", "22 工時、加班費與請假計薪", "22 工時、加班費與請假計薪（續 1 ）", "23 薪資結算、發放與異常處理", "23 薪資結算、發放與異常處理（續 1 ）", "24 薪資預算、例外與內部公平", "24 薪資預算、例外與內部公平（續 1 ）", "25 制度操作案例與薪資試算", "25 年度總薪酬：完整試算", "26 表單 F01 ：職等認定與核薪申請", "26 表單 F01 ：職等認定與核薪申請（續 1 ）", "27 表單 F02 ：績效目標與半年度考核", "27 表單 F02 ：績效目標與半年度考核（續 1 ）", "27 表單 F02 ：績效目標與半年度考核（續 2 ）", "28 表單 F03 ：薪資異動申請", "28 表單 F03-B ：年終／績效獎金核算表", "28 表單 F03-C ：業績獎金核算表", "29 表單 F04 ：考績通知、申訴及改善", "29 表單 F04 ：考績通知、申訴及改善（續 1 ）", "30 表單 F05 ：薪資明細與發放查核", "30 表單 F05 ：薪資明細與發放查核（續 1 ）", "31 來源對照與法規檢核", "31 來源對照與法規檢核（續 1 ）"];
var N = TITLES.length;
var cur = 1;
function pad(n){return (n<10?'0':'')+n}
function src(n){return 's'+pad(n)+'.jpg'}
var img = document.getElementById('slide'), info = document.getElementById('info'), jump = document.getElementById('jump');
TITLES.forEach(function(t,i){ var o=document.createElement('option'); o.value=i+1; o.textContent=(i+1)+'. '+t; jump.appendChild(o); });
var cells = document.getElementById('cells');
TITLES.forEach(function(t,i){
  var d=document.createElement('div'); d.className='cell'; d.dataset.n=i+1;
  d.innerHTML='<img loading="lazy" src="'+src(i+1)+'"><span>'+(i+1)+'. '+t+'</span>';
  d.onclick=function(){ go(i+1); toggleGrid(false); };
  cells.appendChild(d);
});
function go(n){
  cur = Math.min(N, Math.max(1, n));
  img.src = src(cur);
  info.innerHTML = '第 <b>'+cur+'</b> / '+N+' 頁｜'+TITLES[cur-1];
  jump.value = cur;
  document.querySelectorAll('.cell').forEach(function(c){ c.classList.toggle('cur', +c.dataset.n===cur); });
  try{ history.replaceState(null,'','#'+cur); }catch(e){}
  [cur+1, cur-1].forEach(function(m){ if(m>=1&&m<=N){ var p=new Image(); p.src=src(m); } });
}
function toggleGrid(open){ document.getElementById('grid').classList.toggle('open', open); }
document.getElementById('prev').onclick=function(){ go(cur-1); };
document.getElementById('next').onclick=function(){ go(cur+1); };
jump.onchange=function(){ go(+jump.value); };
document.getElementById('gridBtn').onclick=function(){ toggleGrid(true); };
document.getElementById('fsBtn').onclick=function(){
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }
};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'){ go(cur-1); }
  else if(e.key==='Home'){ go(1); } else if(e.key==='End'){ go(N); }
  else if(e.key==='Escape'){ toggleGrid(false); }
});
var tx=null;
document.addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',function(e){
  if(tx===null) return; var dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>60){ go(cur+(dx<0?1:-1)); }
},{passive:true});
img.addEventListener('click',function(e){
  var r=img.getBoundingClientRect(), x=(e.clientX-r.left)/r.width;
  if(x>0.62) go(cur+1); else if(x<0.38) go(cur-1);
});
var h=parseInt((location.hash||'').slice(1),10);
go(isNaN(h)?1:h);
</script>
</body>
</html>
